<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recherche — aperçu des composants</title>
    <link rel="stylesheet" href="./app.css" />
    <style>
      body {
        padding: 1.5rem 2rem;
        background: #f4f6f8;
      }
      .demo-wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      .demo-card {
        background: #fff;
        border: 1px solid #dfe3e8;
        border-radius: 4px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
      }
      .demo-title {
        font-size: 1.1rem;
        color: #235b8b;
        margin: 0 0 0.25rem;
      }
      .demo-hint {
        color: #6b7680;
        margin-bottom: 1rem;
      }
      .demo-out {
        font-family: monospace;
        font-size: 0.72rem;
        background: #263238;
        color: #cfd8dc;
        padding: 0.75rem;
        border-radius: 3px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 12rem;
        overflow: auto;
      }
      .demo-step {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #6b7680;
      }
    </style>
  </head>
  <body>
    <div class="demo-wrap">
      <h1 class="demo-title">Recherche — aperçu des composants</h1>
      <p class="demo-hint">
        Page autonome : le bundle réellement construit (<code>dist/</code>), les styles réellement compilés par
        l’administration Kalaweit, et ses icônes Material Design. Chaque composant est montré ici pour
        validation avant d’être commité (voir <code>doc/recherche/feuille-de-route.md</code>).
      </p>
      <div id="root"></div>
    </div>

    <script>
      /* Les scripts sont chargés avec un horodatage : le navigateur ne doit pas
         resservir un ancien bundle depuis son cache après une reconstruction.
         Toute erreur s'affiche dans la page, pour être lue sans la console. */
      (function() {
        var root = document.getElementById('root');
        function fail(message) {
          root.innerHTML =
            '<div class="demo-card" style="border-color:#ff4136"><h2 class="demo-title" style="color:#ff4136">La page ne s’est pas montée</h2>' +
            '<pre class="demo-out">' + String(message).replace(/</g, '&lt;') + '</pre>' +
            '<p class="demo-hint">À recopier tel quel pour le diagnostic. Rechargez la page après <code>node demo/build.js ../admin</code>.</p></div>';
        }
        window.addEventListener('error', function(ev) {
          fail((ev.message || ev.error) + (ev.filename ? '\n' + ev.filename + ':' + ev.lineno : ''));
        });
        var stamp = '?v=' + Date.now();
        var files = ['./react.development.js', './react-dom.development.js', './icons.js', '../dist/react-bootstrap-front.js'];
        function next(i) {
          if (i >= files.length) {
            try {
              window.runDemo();
            } catch (err) {
              fail(err && err.stack ? err.stack : err);
            }
            return;
          }
          var script = document.createElement('script');
          script.src = files[i] + stamp;
          script.onload = function() { next(i + 1); };
          script.onerror = function() { fail('Script introuvable : ' + files[i]); };
          document.body.appendChild(script);
        }
        next(0);
      })();
    </script>
    <script>
      window.runDemo = function() {
        var e = React.createElement;
        var RBF = window['react-bootstrap-front'];
        if (!RBF) {
          throw new Error('Le bundle dist/react-bootstrap-front.js n’est pas chargé.');
        }
        ['Chip', 'InputSegmented', 'InputPillGroup', 'InputDateRange', 'InputAmountRange', 'SearchSummary', 'InputNaturalSearch', 'SearchForm', 'valuesToFilter', 'normalizeCatalog'].forEach(function(name) {
          if (!RBF[name]) {
            throw new Error('Le bundle ne contient pas ' + name + ' : reconstruire avec npm run build (ou sync-to.sh), puis node demo/build.js ../admin.');
          }
        });

        /* Icône MDI en SVG inline : évite de dépendre de @mdi/react ici. */
        /* Même alignement que les icônes MDI d'admin, sinon elles flottent dans les boutons. */
        function icon(name, size) {
          return e(
            'svg',
            { viewBox: '0 0 24 24', width: size || 16, height: size || 16, style: { verticalAlign: 'middle', display: 'inline-block' } },
            e('path', { d: window.DEMO_ICON_PATHS[name], fill: 'currentColor' })
          );
        }

        var CATEGORIES = [
          { value: 1, label: 'Administration' },
          { value: 2, label: 'Association / Fondation' },
          { value: 3, label: 'Autre' },
          { value: 4, label: 'Entreprise' },
          { value: 5, label: 'Legs' },
          { value: 6, label: 'Particulier' },
          { value: 7, label: 'Revenus financiers' },
          { value: 8, label: 'Zoo' }
        ];
        var MOYENS = ['Alvarum', 'Autre', 'CB', 'Charities Aid Fnd', 'Chèque', 'Espèces', 'Facebook', 'Fnd Roi Baudouin',
          'HelloAsso', 'Kunbis', 'Maecenata Stiftung', 'Nature', 'Paypal', 'Prélèvement', 'RaiseNow', 'Stripe']
          .map(function(label, i) { return { value: i + 1, label: label }; });
        var DON = [
          { value: '', label: 'Tous' },
          { value: 'regular', label: 'Régulier' },
          { value: 'once', label: 'Ponctuel' }
        ];

        /* Le catalogue de la démo : ce qu'admin construira depuis son getCols,
           avec les tournures de la phrase en clair. */
        var PROGRAMMES = [
          { value: 10, label: 'Dulan' }, { value: 11, label: 'Forêt' }, { value: 12, label: 'Parrainages' }, { value: 13, label: 'Soutien' }
        ];
        var CATALOG = RBF.normalizeCatalog([
          { name: 'cli_lastname', label: 'Nom', type: 'text', width: 12, phrase: { label: 'le nom' } },
          { name: 'cli_firstname', label: 'Prénom', type: 'text', width: 12, phrase: { label: 'le prénom' } },
          { name: 'cli_email', label: 'E-mail', type: 'text', width: 12 },
          { name: 'cli_address1', label: 'Adresse', type: 'text', width: 12, phrase: { label: 'l’adresse' } },
          { name: 'cli_cp', label: 'Code postal', type: 'text', width: 6, defaultOperator: 'containsb', phrase: { label: 'le code postal' } },
          { name: 'cli_town', label: 'Ville', type: 'text', width: 9, defaultOperator: 'containsb', phrase: { label: 'la ville' } },
          { name: 'country.cnty_name', label: 'Pays', type: 'text', width: 9, phrase: { label: 'le pays' } },
          { name: 'client_category.clic_id', label: 'Catégorie', type: 'select', options: CATEGORIES, widget: 'pills', hint: 'Aucune cochée = toutes',
            phrase: { eq: 'de catégorie {value}' },
            subjectFor: function(values) { return values.length === 1 && String(values[0]) === '6' ? 'Particuliers' : null; } },
          { name: 'don_kind', virtual: true, label: 'Don', widget: 'segmented', options: DON, fields: ['donations.sponsorship.spo_id'],
            toFilter: function(v, f) {
              f.removeFilter('donations.sponsorship.spo_id');
              if (v === 'regular') { f.addFilter('donations.sponsorship.spo_id', null, RBF.FILTER_OPER_NOT_EMPTY); }
              if (v === 'once') { f.addFilter('donations.sponsorship.spo_id', null, RBF.FILTER_OPER_EMPTY); }
            },
            fromFilter: function(f) { var e = f.findFirst('donations.sponsorship.spo_id'); return !e ? '' : e.getOperator() === RBF.FILTER_OPER_NOT_EMPTY ? 'regular' : 'once'; },
            toText: function(v) { return v === 'regular' ? 'réguliers' : v === 'once' ? 'ponctuels' : ''; } },
          { name: 'donations.don_real_ts', label: 'Paiement', type: 'date', widget: 'date-range',
            phrase: { between: 'ayant payé entre le {from} et le {to}' } },
          { name: 'donations.don_mnt_input', label: 'Montant', type: 'monetary', widget: 'amount-range', phrase: { label: 'le montant' } },
          { name: 'donations.cause.cause_type.caut_id', label: 'Programme', type: 'select', options: PROGRAMMES, widget: 'pills', phrase: { eq: 'pour le programme {value}' } },
          { name: 'donations.payment_type.ptyp_id', label: 'Moyen de paiement', type: 'select', options: MOYENS, widget: 'pills',
            format: function(v, field) { var o = field.options.find(function(x) { return String(x.value) === String(v); }); return o ? o.label.toLowerCase() : String(v); },
            phrase: { eq: 'par {value}' } },
          { name: 'sponsorships.spo_ts', label: 'Ami', type: 'date', widget: 'date-range', phrase: { label: 'l’enregistrement comme ami' } }
        ]);

        var SECTIONS = [
          { name: 'donateur', label: 'Donateur', fields: ['cli_lastname', 'cli_firstname', 'cli_email', 'cli_address1', 'cli_cp', 'cli_town', 'country.cnty_name'] },
          { name: 'categorie', label: 'Catégorie', fields: ['client_category.clic_id'] },
          { name: 'paiement', label: 'Paiement', fields: ['donations.don_real_ts', 'donations.don_mnt_input', 'don_kind'] },
          { name: 'moyen', label: 'Moyen', fields: ['donations.payment_type.ptyp_id'] },
          { name: 'programme', label: 'Programme', fields: ['donations.cause.cause_type.caut_id'] },
          { name: 'ami', label: 'Ami', fields: ['sponsorships.spo_ts'] }
        ];
        var FORM_ICONS = { calendar: icon('calendar', 16), clear: icon('close', 14), check: icon('check', 14), sparkle: icon('sparkle', 16) };

        function card(step, title, hint, children) {
          return e(
            'div',
            { className: 'demo-card' },
            e('div', { className: 'demo-step' }, step),
            e('h2', { className: 'demo-title' }, title),
            e('p', { className: 'demo-hint' }, hint),
            children
          );
        }

        function Demo() {
          var cat = React.useState([6]);
          var moy = React.useState([5]);
          var kind = React.useState('');
          var kind2 = React.useState('once');
          var submitted = React.useState(null);
          var formValues = React.useState({ 'client_category.clic_id': [6], 'donations.don_real_ts': ['2025-01-01', '2025-12-31'], 'donations.payment_type.ptyp_id': [5], 'donations.cause.cause_type.caut_id': [11] });
          var phrase = React.useState('particuliers qui ont donné par chèque en 2025 pour la forêt');
          var quick = React.useState('');
          var pay = React.useState(['2025-01-01', '2025-12-31']);
          var amount = React.useState(['', '']);
          var friend = React.useState(['', '']);

          var state = {
            categories: cat[0], moyens: moy[0], don: kind[0], don_vide_possible: kind2[0],
            paiement: pay[0], montant: amount[0], ami: friend[0]
          };
          var values = {
            'client_category.clic_id': cat[0],
            'donations.payment_type.ptyp_id': moy[0],
            don_kind: kind[0],
            'donations.don_real_ts': pay[0],
            'donations.don_mnt_input': amount[0],
            'sponsorships.spo_ts': friend[0]
          };
          var filter = RBF.valuesToFilter(values, CATALOG);

          return e(
            'div',
            null,
            card(
              'Étape 1 · SearchForm',
              'La fiche de recherche complète',
              'Tout ce qui précède assemblé : phrase en construction, sections pilotées par le catalogue, pied collant avec la phrase en clair. « Voir les donateurs » montre ci-dessous ce que recevrait l’API. Le lien « Critères avancés » attend l’étape 3.',
              e('div', null,
                e(RBF.SearchForm, {
                  catalog: CATALOG, sections: SECTIONS, icons: FORM_ICONS, subject: 'Donateurs',
                  title: 'Rechercher des donateurs', submitLabel: 'Voir les donateurs',
                  values: formValues[0], onChange: function(v) { formValues[1](v); },
                  naturalLanguage: { placeholder: 'Décrivez les donateurs recherchés, par exemple « particuliers qui ont donné par chèque en 2025 pour la forêt »' },
                  advancedLink: { onClick: function() { alert('Critères avancés : étape 3'); } },
                  onSubmit: function(filter, values) { submitted[1]({ filter: filter.asJsonApiObject(), values: values }); }
                }),
                submitted[0] && e('div', { className: 'mt-3' },
                  e('p', { className: 'demo-hint mb-1' }, 'Dernière soumission — ce que recevrait l’API :'),
                  e('div', { className: 'demo-out' }, JSON.stringify(submitted[0].filter, function(k, v) {
                    if (Array.isArray(v) && Object.keys(v).some(function(key) { return isNaN(key); })) {
                      var o = {}; Object.keys(v).forEach(function(key) { o[key] = v[key]; }); return o;
                    }
                    return v;
                  }, 2))
                )
              )
            ),
            card(
              'Étape 1 · InputNaturalSearch',
              'Recherche en langage naturel — « en construction »',
              'Aucun service n’est branché : l’étincelle et « Remplir les critères » affichent une notice, rien d’autre. La variante barre (pour l’en-tête de liste, étape 2) garde la recherche rapide actuelle sur Entrée.',
              e('div', null,
                e(RBF.InputNaturalSearch, {
                  variant: 'card', sparkleIcon: icon('sparkle', 16), value: phrase[0],
                  placeholder: 'Décrivez les donateurs recherchés',
                  hint: 'Les critères ci-dessous seront remplis depuis votre phrase. Vérifiez-les avant de lancer.',
                  onChange: function(ev) { phrase[1](ev.target.value); }
                }),
                e('div', { className: 'mt-3', style: { maxWidth: '560px' } },
                  e(RBF.InputNaturalSearch, {
                    variant: 'bar', sparkleIcon: icon('sparkle', 16), value: quick[0],
                    placeholder: 'Rechercher par nom, prénom ou e-mail…',
                    onChange: function(ev) { quick[1](ev.target.value); },
                    onQuickSearch: function(text, mode) { alert('Recherche rapide actuelle : « ' + text + ' » (' + mode + ')'); }
                  })
                )
              )
            ),
            card(
              'Étape 1 · InputPillGroup',
              'Pastilles à bascule',
              'Plusieurs choix. Une pastille choisie passe en plein avec la coche ; aucune choisie = toutes.',
              e('div', null,
                e(RBF.InputPillGroup, {
                  name: 'clic_id', label: 'Catégorie', hint: 'Aucune cochée = toutes',
                  value: cat[0], options: CATEGORIES, checkIcon: icon('check', 14),
                  onChange: function(ev) { cat[1](ev.target.value); }
                }),
                e(RBF.InputPillGroup, {
                  name: 'ptyp_id', label: 'Moyen',
                  value: moy[0], options: MOYENS, checkIcon: icon('check', 14),
                  onChange: function(ev) { moy[1](ev.target.value); }
                })
              )
            ),
            card(
              'Étape 1 · InputSegmented',
              'Groupe segmenté',
              'Un seul choix. Le motif btn-group + active des listes, sans style propre.',
              e('div', null,
                e(RBF.InputSegmented, {
                  name: 'don_kind', label: 'Don', value: kind[0], options: DON,
                  onChange: function(ev) { kind[1](ev.target.value); }
                }),
                e(RBF.InputSegmented, {
                  name: 'don_kind2', label: 'Avec allowEmpty : re-cliquer désélectionne', value: kind2[0], options: DON.slice(1),
                  allowEmpty: true, help: 'Taille normale, thème primary',
                  size: null, theme: 'primary',
                  onChange: function(ev) { kind2[1](ev.target.value); }
                })
              )
            ),
            card(
              'Étape 1 · InputDateRange / InputAmountRange',
              'Plages',
              'Deux champs, une seule valeur [de, à] : la forme du « entre » du modèle. Les dates sont le champ date de la lib (masque + calendrier) ; le montant affiche lui-même le €. Une seule borne suffit (gte ou ltwe).',
              e('div', null,
                e(RBF.InputDateRange, {
                  name: 'don_real', label: 'Paiement', value: pay[0],
                  calIcon: icon('calendar', 16), delIcon: icon('close', 14),
                  onChange: function(ev) { pay[1](ev.target.value); }
                }),
                e(RBF.InputAmountRange, {
                  name: 'don_mnt', label: 'Montant', value: amount[0],
                  onChange: function(ev) { amount[1](ev.target.value); }
                }),
                e(RBF.InputDateRange, {
                  name: 'spo_ts', label: 'Ami enregistré', value: friend[0], help: 'Une seule borne suffit.',
                  calIcon: icon('calendar', 16), delIcon: icon('close', 14),
                  onChange: function(ev) { friend[1](ev.target.value); }
                })
              )
            ),
            card(
              'Étape 1 · SearchSummary',
              'En clair',
              'La phrase du filtre, calculée en direct depuis les cartes ci-dessus par le catalogue (tournures, sujet « Particuliers » quand seule cette catégorie est cochée). Encart pour le tiroir, variante en ligne pour le pied de la fiche.',
              e('div', null,
                e(RBF.SearchSummary, { filter: filter, catalog: CATALOG, subject: 'Donateurs' }),
                e('div', { className: 'mt-3 p-2 border rounded d-flex justify-content-between align-items-center bg-light' },
                  e(RBF.SearchSummary, { variant: 'inline', filter: filter, catalog: CATALOG, subject: 'Donateurs' }),
                  e('span', { className: 'text-nowrap ml-3' },
                    e('a', { href: '#', className: 'btn btn-link btn-sm', onClick: function(ev) { ev.preventDefault(); cat[1]([]); moy[1]([]); kind[1](''); pay[1](['', '']); amount[1](['', '']); friend[1](['', '']); } }, 'Tout effacer'),
                    e('button', { type: 'button', className: 'btn btn-primary btn-sm' }, 'Voir les donateurs')
                  )
                ),
                e('p', { className: 'demo-hint mt-3 mb-1' }, 'Ce que recevrait l’API :'),
                e('div', { className: 'demo-out' }, JSON.stringify(filter.asJsonApiObject(), function(k, v) {
                  if (Array.isArray(v) && Object.keys(v).some(function(key) { return isNaN(key); })) {
                    var o = {}; Object.keys(v).forEach(function(key) { o[key] = v[key]; }); return o;
                  }
                  return v;
                }, 2))
              )
            ),
            card(
              'Étapes 2 et 3 · Chip',
              'Les autres variantes de pastille (pour avis, pas encore utilisées)',
              'Critère actif avec ×, facette avec chevron et compteur, ajout en pointillés, pastille simple.',
              e('div', null,
                e(RBF.Chip, { variant: 'active', label: 'Don : Régulier', className: 'mr-2 mb-2', removeIcon: icon('close', 14), onRemove: function() { alert('Retirer « Don : Régulier »'); } }),
                e(RBF.Chip, { variant: 'active', label: 'Programme : Dulan', className: 'mr-2 mb-2', removeIcon: icon('close', 14), onRemove: function() { alert('Retirer « Programme : Dulan »'); } }),
                e(RBF.Chip, { variant: 'facet', label: 'Moyen de paiement', count: 2, className: 'mr-2 mb-2', caretIcon: icon('caret', 14), onClick: function() { alert('Ouvrir la facette'); } }),
                e(RBF.Chip, { variant: 'facet', label: 'Catégorie', className: 'mr-2 mb-2', caretIcon: icon('caret', 14) }),
                e(RBF.Chip, { variant: 'facet', label: 'Période', className: 'mr-2 mb-2', caretIcon: icon('caret', 14) }),
                e(RBF.Chip, { variant: 'add', label: e('span', null, icon('plus', 14), ' Critère'), className: 'mr-2 mb-2' }),
                e(RBF.Chip, { variant: 'default', label: 'Simple', className: 'mr-2 mb-2' }),
                e('div', { className: 'mt-2' },
                  e('a', { href: '#', className: 'btn btn-link btn-sm', onClick: function(ev) { ev.preventDefault(); cat[1]([]); moy[1]([]); kind[1](''); } }, 'Tout effacer')
                )
              )
            ),
            card(
              '',
              'Valeurs émises',
              'Ce que les composants envoient à l’application ; se met à jour au clic.',
              e('div', { className: 'demo-out' }, JSON.stringify(state, null, 2))
            )
          );
        }

        ReactDOM.render(e(Demo), document.getElementById('root'));
      };
    </script>
  </body>
</html>
