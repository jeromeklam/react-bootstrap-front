<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recherche — aperçu des composants</title>
    <link rel="stylesheet" href="./app.css" />
    <style>
      body {
        padding: 1.5rem 2rem;
        background: #f4f6f8;
      }
      .demo-wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      .demo-card {
        background: #fff;
        border: 1px solid #dfe3e8;
        border-radius: 4px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
      }
      .demo-title {
        font-size: 1.1rem;
        color: #235b8b;
        margin: 0 0 0.25rem;
      }
      .demo-hint {
        color: #6b7680;
        margin-bottom: 1rem;
      }
      .demo-out {
        font-family: monospace;
        font-size: 0.72rem;
        background: #263238;
        color: #cfd8dc;
        padding: 0.75rem;
        border-radius: 3px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 12rem;
        overflow: auto;
      }
      .demo-step {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #6b7680;
      }
    </style>
  </head>
  <body>
    <div class="demo-wrap">
      <h1 class="demo-title">Recherche — aperçu des composants</h1>
      <p class="demo-hint">
        Page autonome : le bundle réellement construit (<code>dist/</code>), les styles réellement compilés par
        l’administration Kalaweit, et ses icônes Material Design. Chaque composant est montré ici pour
        validation avant d’être commité (voir <code>doc/recherche/feuille-de-route.md</code>).
      </p>
      <div id="root"></div>
    </div>

    <script>
      /* Les scripts sont chargés avec un horodatage : le navigateur ne doit pas
         resservir un ancien bundle depuis son cache après une reconstruction.
         Toute erreur s'affiche dans la page, pour être lue sans la console. */
      (function() {
        var root = document.getElementById('root');
        function fail(message) {
          root.innerHTML =
            '<div class="demo-card" style="border-color:#ff4136"><h2 class="demo-title" style="color:#ff4136">La page ne s’est pas montée</h2>' +
            '<pre class="demo-out">' + String(message).replace(/</g, '&lt;') + '</pre>' +
            '<p class="demo-hint">À recopier tel quel pour le diagnostic. Rechargez la page après <code>node demo/build.js ../admin</code>.</p></div>';
        }
        window.addEventListener('error', function(ev) {
          fail((ev.message || ev.error) + (ev.filename ? '\n' + ev.filename + ':' + ev.lineno : ''));
        });
        var stamp = '?v=' + Date.now();
        var files = ['./react.development.js', './react-dom.development.js', './icons.js', '../dist/react-bootstrap-front.js'];
        function next(i) {
          if (i >= files.length) {
            try {
              window.runDemo();
            } catch (err) {
              fail(err && err.stack ? err.stack : err);
            }
            return;
          }
          var script = document.createElement('script');
          script.src = files[i] + stamp;
          script.onload = function() { next(i + 1); };
          script.onerror = function() { fail('Script introuvable : ' + files[i]); };
          document.body.appendChild(script);
        }
        next(0);
      })();
    </script>
    <script>
      window.runDemo = function() {
        var e = React.createElement;
        var RBF = window['react-bootstrap-front'];
        if (!RBF) {
          throw new Error('Le bundle dist/react-bootstrap-front.js n’est pas chargé.');
        }
        ['Chip', 'InputSegmented', 'InputPillGroup', 'InputDateRange', 'InputAmountRange', 'SearchSummary', 'InputNaturalSearch', 'SearchForm', 'SearchChipBar', 'FacetPopover', 'SearchDrawer', 'Drawer', 'valuesToFilter', 'normalizeCatalog', 'createNaturalLanguage'].forEach(function(name) {
          if (!RBF[name]) {
            throw new Error('Le bundle ne contient pas ' + name + ' : reconstruire avec npm run build (ou sync-to.sh), puis node demo/build.js ../admin.');
          }
        });

        /* Icône MDI en SVG inline : évite de dépendre de @mdi/react ici. */
        /* Même alignement que les icônes MDI d'admin, sinon elles flottent dans les boutons. */
        function icon(name, size) {
          return e(
            'svg',
            { viewBox: '0 0 24 24', width: size || 16, height: size || 16, style: { verticalAlign: 'middle', display: 'inline-block' } },
            e('path', { d: window.DEMO_ICON_PATHS[name], fill: 'currentColor' })
          );
        }

        var CATEGORIES = [
          { value: 1, label: 'Administration' },
          { value: 2, label: 'Association / Fondation' },
          { value: 3, label: 'Autre' },
          { value: 4, label: 'Entreprise' },
          { value: 5, label: 'Legs' },
          { value: 6, label: 'Particulier' },
          { value: 7, label: 'Revenus financiers' },
          { value: 8, label: 'Zoo' }
        ];
        var MOYENS = ['Alvarum', 'Autre', 'CB', 'Charities Aid Fnd', 'Chèque', 'Espèces', 'Facebook', 'Fnd Roi Baudouin',
          'HelloAsso', 'Kunbis', 'Maecenata Stiftung', 'Nature', 'Paypal', 'Prélèvement', 'RaiseNow', 'Stripe']
          .map(function(label, i) { return { value: i + 1, label: label }; });
        var DON = [
          { value: '', label: 'Tous' },
          { value: 'regular', label: 'Régulier' },
          { value: 'once', label: 'Ponctuel' }
        ];

        /* Le catalogue de la démo : ce qu'admin construira depuis son getCols,
           avec les tournures de la phrase en clair. */
        var PROGRAMMES = [
          { value: 10, label: 'Dulan' }, { value: 11, label: 'Forêt' }, { value: 12, label: 'Parrainages' }, { value: 13, label: 'Soutien' }
        ];
        var CATALOG = RBF.normalizeCatalog([
          { name: 'cli_lastname', label: 'Nom', type: 'text', width: 12, phrase: { label: 'le nom' } },
          { name: 'cli_firstname', label: 'Prénom', type: 'text', width: 12, phrase: { label: 'le prénom' } },
          { name: 'cli_email', label: 'E-mail', type: 'text', width: 12, phrase: { label: 'l’e-mail' } },
          { name: 'cli_address1', label: 'Adresse', type: 'text', width: 12, phrase: { label: 'l’adresse' } },
          { name: 'cli_cp', label: 'Code postal', type: 'text', width: 6, defaultOperator: 'containsb', phrase: { label: 'le code postal' }, description: 'commence par le numéro de département' },
          { name: 'cli_town', label: 'Ville', type: 'text', width: 9, defaultOperator: 'containsb', phrase: { label: 'la ville' } },
          { name: 'country.cnty_name', label: 'Pays', type: 'text', width: 9, phrase: { label: 'le pays' }, description: 'nom du pays en toutes lettres' },
          { name: 'client_category.clic_id', label: 'Catégorie', type: 'select', options: CATEGORIES, widget: 'pills', hint: 'Aucune cochée = toutes', facet: { order: 20 }, description: 'catégorie du donateur',
            phrase: { eq: 'de catégorie {value}' },
            subjectFor: function(values) { return values.length === 1 && String(values[0]) === '6' ? 'Particuliers' : null; } },
          { name: 'don_kind', virtual: true, label: 'Don', widget: 'segmented', options: DON, fields: ['donations.sponsorship.spo_id'],
            description: 'régulier = parrainage avec paiements récurrents, ponctuel = don isolé',
            toFilter: function(v, f) {
              f.removeFilter('donations.sponsorship.spo_id');
              if (v === 'regular') { f.addFilter('donations.sponsorship.spo_id', null, RBF.FILTER_OPER_NOT_EMPTY); }
              if (v === 'once') { f.addFilter('donations.sponsorship.spo_id', null, RBF.FILTER_OPER_EMPTY); }
            },
            fromFilter: function(f) { var e = f.findFirst('donations.sponsorship.spo_id'); return !e ? '' : e.getOperator() === RBF.FILTER_OPER_NOT_EMPTY ? 'regular' : 'once'; },
            toText: function(v) { return v === 'regular' ? 'réguliers' : v === 'once' ? 'ponctuels' : ''; } },
          { name: 'donations.don_real_ts', label: 'Paiement', type: 'date', widget: 'date-range',
            phrase: { between: 'ayant payé entre le {from} et le {to}' }, description: 'date d’un paiement : « a donné en 2024 », « dons entre deux dates »' },
          { name: 'donations.don_mnt_input', label: 'Montant', type: 'monetary', widget: 'amount-range', phrase: { label: 'le montant' }, description: 'montant d’un paiement, en euros' },
          { name: 'donations.cause.cause_type.caut_id', label: 'Programme', type: 'select', options: PROGRAMMES, widget: 'pills', phrase: { eq: 'pour le programme {value}' }, description: 'programme soutenu' },
          { name: 'donations.cause.cau_name', label: 'Animal / projet', type: 'text', width: 12, phrase: { label: 'l’animal ou le projet' }, description: 'nom de l’animal ou du projet soutenu : « parrainent Kiki », « donnent pour Bimbo »' },
          { name: 'donations.payment_type.ptyp_id', label: 'Moyen de paiement', type: 'select', options: MOYENS, widget: 'pills', facet: { order: 10, countLabel: function(n) { return n + ' moyen' + (n > 1 ? 's' : ''); } },
            format: function(v, field) { var o = field.options.find(function(x) { return String(x.value) === String(v); }); return o ? o.label.toLowerCase() : String(v); },
            phrase: { eq: 'par {value}' }, description: 'moyen de paiement des dons' },
          { name: 'sponsorships.spo_ts', label: 'Ami', type: 'date', widget: 'date-range', phrase: { label: 'l’enregistrement comme ami' }, description: 'date à laquelle le donateur a parrainé un ami (parrain, filleul)' },
          { name: 'last_donation.don_real_ts', label: 'Période', type: 'date', facet: { order: 30, kind: 'range' }, phrase: { label: 'le dernier paiement' }, description: 'date du dernier paiement reçu : « dernier don », « n’a rien donné depuis »' }
        ]);
        var BAR_ICONS = { close: icon('close', 12), caret: icon('caret', 14), add: icon('plus', 14), calendar: icon('calendar', 16), clear: icon('close', 14) };
        var DRAWER_ICONS = { close: icon('close', 18), expand: icon('expand', 18), collapse: icon('collapse', 18), add: icon('plus', 14), remove: icon('close', 14), calendar: icon('calendar', 16), clear: icon('close', 14), check: icon('check', 14) };

        var SECTIONS = [
          { name: 'donateur', label: 'Donateur', fields: ['cli_lastname', 'cli_firstname', 'cli_email', 'cli_address1', 'cli_cp', 'cli_town', 'country.cnty_name'] },
          { name: 'categorie', label: 'Catégorie', fields: ['client_category.clic_id'] },
          { name: 'paiement', label: 'Paiement', fields: ['donations.don_real_ts', 'donations.don_mnt_input', 'don_kind'] },
          { name: 'moyen', label: 'Moyen', fields: ['donations.payment_type.ptyp_id'] },
          { name: 'programme', label: 'Programme', fields: ['donations.cause.cause_type.caut_id', 'donations.cause.cau_name'] },
          { name: 'ami', label: 'Ami', fields: ['sponsorships.spo_ts'] }
        ];
        var FORM_ICONS = { calendar: icon('calendar', 16), clear: icon('close', 14), check: icon('check', 14), sparkle: icon('sparkle', 16) };

        /* Étape 4 : les exemples donnés au modèle (noms du catalogue, valeurs comme il
           doit les écrire) et le sujet de la liste. */
        function isoDaysAgo(days) { var d = new Date(); d.setDate(d.getDate() - days); return d.toISOString().slice(0, 10); }
        var NATURAL_SUBJECT = 'la liste des donateurs d’une association de protection animale';
        var NATURAL_EXAMPLES = [
          { phrase: 'particuliers de Strasbourg ayant donné plus de 100 € en 2025',
            criteria: [
              { name: 'client_category.clic_id', operator: 'eq', values: ['Particulier'] },
              { name: 'cli_town', operator: 'contains', values: ['Strasbourg'] },
              { name: 'donations.don_mnt_input', operator: 'gt', values: ['100'] },
              { name: 'donations.don_real_ts', operator: 'between', values: ['2025-01-01', '2025-12-31'] }
            ] },
          { phrase: 'au moins 50 € par prélèvement, rien donné depuis six mois',
            criteria: [
              { name: 'donations.don_mnt_input', operator: 'gte', values: ['50'] },
              { name: 'donations.payment_type.ptyp_id', operator: 'eq', values: ['Prélèvement'] },
              { name: 'last_donation.don_real_ts', operator: 'ltwe', values: [isoDaysAgo(183)] }
            ] },
          { phrase: 'donateurs réguliers sans e-mail, membres du club',
            criteria: [
              { name: 'don_kind', operator: 'eq', values: ['Régulier'] },
              { name: 'cli_email', operator: 'empty', values: [] }
            ],
            unmatched: ['membres du club'] }
        ];

        function card(step, title, hint, children) {
          return e(
            'div',
            { className: 'demo-card' },
            e('div', { className: 'demo-step' }, step),
            e('h2', { className: 'demo-title' }, title),
            e('p', { className: 'demo-hint' }, hint),
            children
          );
        }

        function Demo() {
          var cat = React.useState([6]);
          var moy = React.useState([5]);
          var kind = React.useState('');
          var kind2 = React.useState('once');
          var submitted = React.useState(null);
          var drawer = React.useState(window.location.hash === '#tiroir');
          var listFilter = React.useState(function() {
            var f = new RBF.Filter(); f.init(RBF.FILTER_MODE_AND, RBF.FILTER_OPER_LIKE);
            f.addFilter('group.id', 15, RBF.FILTER_OPER_EQUAL, true);
            f.addFilter('donations.sponsorship.spo_id', null, RBF.FILTER_OPER_NOT_EMPTY);
            f.setFilterValues('donations.cause.cause_type.caut_id', [10]);
            f.setFilterValues('donations.payment_type.ptyp_id', [5, 14]);
            ['cli_firstname', 'cli_lastname', 'cli_email'].forEach(function(n) { f.addFilter(n, 'dup', RBF.FILTER_OPER_LIKE, false, false, true, 'quick'); });
            return f;
          });
          var formValues = React.useState({ 'client_category.clic_id': [6], 'donations.don_real_ts': ['2025-01-01', '2025-12-31'], 'donations.payment_type.ptyp_id': [5], 'donations.cause.cause_type.caut_id': [11] });
          var phrase = React.useState('particuliers qui ont donné par chèque en 2025 pour la forêt');
          var quick = React.useState('');
          var pay = React.useState(['2025-01-01', '2025-12-31']);
          var amount = React.useState(['', '']);
          var friend = React.useState(['', '']);
          var llmUrl = React.useState('http://localhost:11434');
          var llmModel = React.useState('qwen2.5:7b');
          var llmPhrase = React.useState('');
          var llmResult = React.useState(null);
          var llmTiming = React.useState(null);
          var llmVocab = React.useState(function() { try { return window.localStorage.getItem('demo.llm.vocab') || ''; } catch (ex) { return ''; } });
          var llmLearned = React.useState(function() { try { return JSON.parse(window.localStorage.getItem('demo.llm.learned') || '[]'); } catch (ex) { return []; } });
          /* Une définition par ligne : « terme = explication » ; les critères appris
             (l'explication interprétée une fois) complètent l'entrée. */
          function vocabulary(text, learnedList) {
            var source = typeof text === 'string' ? text : llmVocab[0];
            var known0 = learnedList || llmLearned[0];
            return source.split('\n').map(function(line) {
              var i = line.indexOf('=');
              if (i <= 0) { return null; }
              var entry = { term: line.slice(0, i).trim(), meaning: line.slice(i + 1).trim() };
              var known = known0.find(function(l) { return l.term === entry.term && l.meaning === entry.meaning; });
              if (known) { entry.criteria = known.criteria; entry.mode = known.mode; }
              return entry;
            }).filter(Boolean);
          }
          /* « Apprendre » : chaque explication est interprétée comme une demande, ses
             critères sont gardés ; dans l'application, l'utilisateur les verra en clair
             et confirmera avant d'enregistrer. */
          function learnVocabulary(text) {
            var plain = RBF.createNaturalLanguage({ transport: ollamaTransport, catalog: CATALOG, subject: NATURAL_SUBJECT, examples: NATURAL_EXAMPLES });
            var todo = vocabulary(text).filter(function(v) { return !v.criteria; });
            return todo.reduce(function(chain, entry) {
              return chain.then(function(acc) {
                return plain(entry.meaning, {}).then(function(r) {
                  var crit = r.criteria.map(function(c) { return { name: c.name, operator: c.operator, values: c.values }; });
                  return acc.concat([{ term: entry.term, meaning: entry.meaning, mode: r.mode, criteria: crit }]);
                });
              });
            }, Promise.resolve([])).then(function(learned) {
              var all = llmLearned[0].concat(learned);
              llmLearned[1](all);
              try { window.localStorage.setItem('demo.llm.learned', JSON.stringify(all)); } catch (ex) {}
              return all;
            });
          }

          /* Le transport de la démo parle directement à l'Ollama du poste ; dans
             l'application, c'est l'API qui relaie (/v1/asso/llm/interpret). Ollama
             refuse l'origine « null » des pages file:// : servir la démo en http. */
          function ollamaTransport(request) {
            var t0 = Date.now();
            return fetch(llmUrl[0].replace(/\/$/, '') + '/api/chat', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: llmModel[0],
                messages: [{ role: 'system', content: request.system }, { role: 'user', content: request.user }],
                stream: false, format: request.format,
                options: { temperature: 0, num_ctx: 4096, num_predict: 400 }, keep_alive: '15m'
              })
            }).then(function(r) {
              if (!r.ok) { throw new Error('Ollama : HTTP ' + r.status); }
              return r.json();
            }).then(function(j) { llmTiming[1](Date.now() - t0); return { content: j.message.content }; });
          }
          var naturalOnList = RBF.createNaturalLanguage({ transport: ollamaTransport, catalog: CATALOG, base: function() { return listFilter[0]; }, subject: NATURAL_SUBJECT, examples: NATURAL_EXAMPLES, vocabulary: vocabulary });
          var naturalOnForm = RBF.createNaturalLanguage({ transport: ollamaTransport, catalog: CATALOG, subject: NATURAL_SUBJECT, examples: NATURAL_EXAMPLES, vocabulary: vocabulary });

          /* #llm=<phrase> : tape la phrase dans la barre et l'envoie, pour les captures
             d'écran automatiques (même rôle que #tiroir). */
          React.useEffect(function() {
            var v = window.location.hash.match(/[#&]vocab=([^&]+)/);
            if (v) { try { window.localStorage.setItem('demo.llm.vocab', decodeURIComponent(v[1])); } catch (ex) {} llmVocab[1](decodeURIComponent(v[1])); }
            var m = window.location.hash.match(/[#&]llm=([^&]+)/);
            if (!m) { return; }
            var text = decodeURIComponent(m[1]);
            var ready = v ? new Promise(function(resolve) { setTimeout(function() { learnVocabulary(decodeURIComponent(v[1])).then(resolve, resolve); }, 300); }) : Promise.resolve();
            ready.then(function() {
              setTimeout(function() {
                var input = document.querySelector('.demo-card .rbf-natural-search-bar input');
                if (!input) { return; }
                Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set.call(input, text);
                input.dispatchEvent(new Event('input', { bubbles: true }));
                setTimeout(function() { input.form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); }, 50);
              }, 300);
            });
          }, []);

          var state = {
            categories: cat[0], moyens: moy[0], don: kind[0], don_vide_possible: kind2[0],
            paiement: pay[0], montant: amount[0], ami: friend[0]
          };
          var values = {
            'client_category.clic_id': cat[0],
            'donations.payment_type.ptyp_id': moy[0],
            don_kind: kind[0],
            'donations.don_real_ts': pay[0],
            'donations.don_mnt_input': amount[0],
            'sponsorships.spo_ts': friend[0]
          };
          var filter = RBF.valuesToFilter(values, CATALOG);

          return e(
            'div',
            null,
            card(
              'Étape 4 · Langage naturel',
              'La phrase devient des critères — avec le vrai modèle',
              'La barre interroge l’Ollama de ce poste (même modèle que le serveur) avec le prompt et le schéma JSON de la bibliothèque ; la réponse est vérifiée (champs, opérateurs, valeurs, doublons) puis appliquée à la liste de l’étape 2 — la recherche rapide et les fixes sont conservés. Sous le champ : l’attente, puis ce qui n’a pas été compris ou a été corrigé. La fiche de recherche plus bas remplit ses champs de la même façon (« Remplir les critères »). Depuis un fichier local, Ollama refuse l’origine : servir la démo avec « python3 -m http.server 8276 » à la racine de la lib et ouvrir http://localhost:8276/demo/recherche.html.',
              e('div', null,
                e('div', { className: 'form-row mb-3', style: { maxWidth: '640px' } },
                  e('div', { className: 'col-8' },
                    e('input', { type: 'text', className: 'form-control form-control-sm', value: llmUrl[0], onChange: function(ev) { llmUrl[1](ev.target.value); }, 'aria-label': 'URL d’Ollama' })),
                  e('div', { className: 'col-4' },
                    e('select', { className: 'custom-select custom-select-sm', value: llmModel[0], onChange: function(ev) { llmModel[1](ev.target.value); } },
                      e('option', { value: 'qwen2.5:7b' }, 'qwen2.5:7b'), e('option', { value: 'qwen2.5:3b' }, 'qwen2.5:3b')))
                ),
                e('div', { style: { maxWidth: '640px' } },
                  e(RBF.InputNaturalSearch, {
                    variant: 'bar', sparkleIcon: icon('sparkle', 16), value: llmPhrase[0],
                    placeholder: 'Par exemple : entreprises de Lyon ayant donné au moins 500 euros en 2024',
                    onChange: function(ev) { llmPhrase[1](ev.target.value); },
                    onNaturalLanguage: naturalOnList,
                    context: { filter: listFilter[0] },
                    onResult: function(r) { llmResult[1](r); if (r && r.filter) { listFilter[1](r.filter); } }
                  })
                ),
                e('div', { className: 'mt-3', style: { maxWidth: '640px' } },
                  e('label', { className: 'demo-hint mb-1 d-block' }, 'Vocabulaire du métier, une définition par ligne (« terme = explication ») — ce que les utilisateurs expliqueront eux-mêmes depuis l’écran :'),
                  e('textarea', { className: 'form-control form-control-sm', rows: 3, value: llmVocab[0],
                    placeholder: 'banlieue = les départements 77, 78, 91, 92, 93, 94 et 95 autour de Paris : Code postal commence par l’un d’eux',
                    onChange: function(ev) { llmVocab[1](ev.target.value); try { window.localStorage.setItem('demo.llm.vocab', ev.target.value); } catch (ex) {} } }),
                  e('div', { className: 'mt-2 d-flex align-items-start' },
                    e('button', { type: 'button', className: 'btn btn-sm btn-outline-secondary mr-3', onClick: function() { learnVocabulary(); } }, 'Apprendre le vocabulaire'),
                    e('div', { className: 'small text-muted' },
                      vocabulary().map(function(v, i) {
                        var f = v.criteria ? RBF.naturalToResult({ criteria: v.criteria, mode: v.mode }, CATALOG).filter : null;
                        return e('div', { key: i }, '« ' + v.term + ' » → ' + (f ? RBF.filterToSentence(f, CATALOG, { subject: 'donateurs' }) : 'pas encore appris'));
                      })
                    )
                  )
                ),
                llmResult[0] && e('div', { className: 'mt-3' },
